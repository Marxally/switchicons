name: Update data and deploy

on:
  schedule:
    # 06:00 UTC daily — titledb itself updates on its own schedule,
    # this just pulls whatever's latest at that time.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate data.json from titledb
        run: python3 scripts/build_data.py --out data.json

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Update data.json ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to data.json"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
